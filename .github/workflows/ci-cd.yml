name: MedD CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: dotnet restore Medd.slnx
      
      - name: Build solution
        run: dotnet build Medd.slnx --no-restore --configuration Release
      
      - name: Run tests
        run: dotnet test Medd.slnx --no-build --configuration Release
