name: MedD CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 1) Билд и тесты (без внешних сервисов)
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore MedD.sln

      - name: Build solution
        run: dotnet build MedD.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test MedD.sln --no-build --configuration Release

  # 2) Проверка форматирования (дополнительная, но полезная)
  check-formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check formatting
        run: dotnet format --verify-no-changes

  # 3) Сборка Docker-образов (опционально)
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Catalog API
        run: docker build -t medd-catalog-api ./backend/Catalog

      - name: Build Order API
        run: docker build -t medd-order-api ./backend/Order

      - name: Build Frontend
        run: docker build -t medd-frontend ./frontend/medd-frontend

      - name: Log Docker images
        run: docker images | grep medd
